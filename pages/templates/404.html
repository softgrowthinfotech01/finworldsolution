<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ALORNIX</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-20px) rotate(-5deg); }
            75% { transform: translateY(20px) rotate(5deg); }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.7; }
        }
        
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
        
        .animate-pulse-slow {
            animation: pulse 3s ease-in-out infinite;
        }
        
        .gradient-text {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .glitch {
            position: relative;
            text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                         0.025em 0.04em 0 #fffc00;
            animation: glitch 725ms infinite;
        }
        
        @keyframes glitch {
            0% {
                text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                             0.025em 0.04em 0 #fffc00;
            }
            15% {
                text-shadow: 0.05em 0 0 #00fffc, -0.03em -0.04em 0 #fc00ff,
                             0.025em 0.04em 0 #fffc00;
            }
            16% {
                text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff,
                             -0.05em -0.05em 0 #fffc00;
            }
            49% {
                text-shadow: -0.05em -0.025em 0 #00fffc, 0.025em 0.035em 0 #fc00ff,
                             -0.05em -0.05em 0 #fffc00;
            }
            50% {
                text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff,
                             0 -0.04em 0 #fffc00;
            }
            99% {
                text-shadow: 0.05em 0.035em 0 #00fffc, 0.03em 0 0 #fc00ff,
                             0 -0.04em 0 #fffc00;
            }
            100% {
                text-shadow: -0.05em 0 0 #00fffc, -0.025em -0.04em 0 #fc00ff,
                             -0.04em -0.025em 0 #fffc00;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 to-indigo-50 min-h-screen flex items-center justify-center">
    
    <!-- Main Container -->
    <div class="container mx-auto px-4">
        <div class="max-w-4xl mx-auto text-center">
            <!-- Animated 404 -->
            <div class="relative mb-8">
                <div class="text-[150px] md:text-[200px] font-bold gradient-text animate-float leading-none">
                    404
                </div>
                <div class="absolute inset-0 flex items-center justify-center">
                    <div class="w-64 h-64 bg-purple-500/10 rounded-full animate-pulse-slow"></div>
                </div>
            </div>
            
            <!-- Error Message -->
            <h1 class="text-3xl md:text-5xl font-bold mb-4 text-gray-800">
                Oops! Page Not Found
            </h1>
            
            <p class="text-xl text-gray-600 mb-8 max-w-2xl mx-auto">
                The page you're looking for seems to have vanished into the digital void. 
                Don't worry, even the best explorers get lost sometimes!
            </p>
            
            <!-- Fun Animation -->
            <div class="mb-12">
                <svg class="w-32 h-32 mx-auto text-purple-500 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>
            
            <!-- Action Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 justify-center mb-12">
                <a href="/" class="px-8 py-3 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-lg hover:shadow-lg transition font-semibold">
                    Go Back Home
                </a>
                <button onclick="history.back()" class="px-8 py-3 border-2 border-purple-600 text-purple-600 rounded-lg hover:bg-purple-50 transition font-semibold">
                    Previous Page
                </button>
            </div>
            
            <!-- Helpful Links -->
            <div class="bg-white rounded-xl p-8 shadow-lg">
                <h2 class="text-2xl font-bold mb-6">Maybe you were looking for:</h2>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <a href="/about.html" class="group">
                        <div class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition">
                            <svg class="w-8 h-8 text-purple-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                            <p class="text-sm font-medium text-gray-700 group-hover:text-purple-600 transition">About</p>
                        </div>
                    </a>
                    <a href="/services.html" class="group">
                        <div class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition">
                            <svg class="w-8 h-8 text-purple-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-sm font-medium text-gray-700 group-hover:text-purple-600 transition">Services</p>
                        </div>
                    </a>
                    <a href="/portfolio.html" class="group">
                        <div class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition">
                            <svg class="w-8 h-8 text-purple-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path>
                            </svg>
                            <p class="text-sm font-medium text-gray-700 group-hover:text-purple-600 transition">Portfolio</p>
                        </div>
                    </a>
                    <a href="/contact.html" class="group">
                        <div class="p-4 bg-purple-50 rounded-lg hover:bg-purple-100 transition">
                            <svg class="w-8 h-8 text-purple-600 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                            </svg>
                            <p class="text-sm font-medium text-gray-700 group-hover:text-purple-600 transition">Contact</p>
                        </div>
                    </a>
                </div>
            </div>
            
            <!-- Search Bar -->
            <div class="mt-12">
                <p class="text-gray-600 mb-4">Or try searching for what you need:</p>
                <form class="max-w-md mx-auto">
                    <div class="relative">
                        <input type="text" placeholder="Search..." 
                               class="w-full px-6 py-3 pr-12 rounded-full border-2 border-gray-200 focus:border-purple-600 focus:outline-none">
                        <button type="submit" class="absolute right-2 top-1/2 transform -translate-y-1/2 p-2 bg-purple-600 text-white rounded-full hover:bg-purple-700 transition">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Decorative Elements -->
    <div class="fixed top-10 left-10 w-20 h-20 bg-purple-400/20 rounded-full blur-xl"></div>
    <div class="fixed bottom-10 right-10 w-32 h-32 bg-indigo-400/20 rounded-full blur-xl"></div>
    <div class="fixed top-1/2 right-20 w-16 h-16 bg-pink-400/20 rounded-full blur-xl"></div>
    
    <!-- Fun Easter Egg -->
    <script>
        let clickCount = 0;
        document.querySelector('.gradient-text').addEventListener('click', function() {
            clickCount++;
            if (clickCount === 3) {
                this.classList.add('glitch');
                setTimeout(() => {
                    this.classList.remove('glitch');
                    clickCount = 0;
                }, 2000);
            }
        });
    </script>
</body>
</html>
